name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use current npm CLI
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package versions
        run: node scripts/verify-release-version.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Fake smoke
        run: npm run smoke:fake

      - name: Build and smoke plugin
        run: npm run smoke:plugin

      - name: Verify packed install
        run: npm run smoke:pack

      - name: Prepare OIDC npm publish auth
        run: |
          # actions/setup-node writes an empty _authToken placeholder when
          # NODE_AUTH_TOKEN is unset. That blocks npm Trusted Publishing OIDC.
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "${NPM_CONFIG_USERCONFIG}" ]]; then
            sed -i '/:_authToken=/d' "${NPM_CONFIG_USERCONFIG}"
            echo "Cleaned ${NPM_CONFIG_USERCONFIG} for OIDC publish:"
            cat "${NPM_CONFIG_USERCONFIG}"
          fi

      - name: Publish core to npmjs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "graph-engineering-loop-core@${VERSION}" version >/dev/null 2>&1; then
            echo "graph-engineering-loop-core@${VERSION} already exists; skipping."
            exit 0
          fi
          if ! npm publish --workspace ./packages/core --access public --provenance; then
            echo "::error::Failed to publish graph-engineering-loop-core@${VERSION}."
            echo "Configure npm Trusted Publishing for this package:"
            echo "  Repository: AnupDangi/Graph-Engineering-Loop"
            echo "  Workflow: release.yml"
            echo "  Allowed action: npm publish"
            echo "Or set NPM_TOKEN with Read/Write on BOTH packages + Bypass 2FA, then restore token publish."
            exit 1
          fi

      - name: Publish CLI to npmjs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "graph-engineering-loop-workspace@${VERSION}" version >/dev/null 2>&1; then
            echo "graph-engineering-loop-workspace@${VERSION} already exists; skipping."
            exit 0
          fi
          if ! npm publish --workspace ./packages/cli --access public --provenance; then
            echo "::error::Failed to publish graph-engineering-loop-workspace@${VERSION}."
            echo "Configure npm Trusted Publishing for this package too (same repo/workflow)."
            exit 1
          fi

      - name: Verify published CLI from a clean directory
        run: npm run smoke:npx

      - name: Create GitHub Release with plugin install notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > /tmp/release-notes.md <<EOF
          ## Graph Engineering Loop ${GITHUB_REF_NAME}

          ### npm

          \`\`\`bash
          npm install -g graph-engineering-loop-workspace
          npx graph-engineering-loop-workspace --version
          loopgraph --version
          \`\`\`

          ### Claude Code plugin (from this repo)

          \`\`\`text
          /plugin marketplace add AnupDangi/Graph-Engineering-Loop
          /plugin install graph-engineering-loop@graph-engineering-loop-marketplace
          \`\`\`

          Local plugin check:

          \`\`\`bash
          npm run build:plugin
          claude --plugin-dir ./claude-plugin
          \`\`\`

          Packages published:

          - graph-engineering-loop-core@${VERSION}
          - graph-engineering-loop-workspace@${VERSION}
          EOF
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Graph Engineering Loop ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md
