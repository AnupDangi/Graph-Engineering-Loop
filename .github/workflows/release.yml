name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify tag matches package versions
        run: node scripts/verify-release-version.mjs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Fake smoke
        run: npm run smoke:fake

      - name: Build and smoke plugin
        run: npm run smoke:plugin

      - name: Verify packed install
        run: npm run smoke:pack

      - name: Verify npm publisher authentication
        run: npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish core to npmjs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "graph-engineering-loop-core@${VERSION}" version >/dev/null 2>&1; then
            echo "graph-engineering-loop-core@${VERSION} already exists; skipping."
          else
            npm publish --workspace ./packages/core --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI to npmjs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "graph-engineering-loop-workspace@${VERSION}" version >/dev/null 2>&1; then
            echo "graph-engineering-loop-workspace@${VERSION} already exists; skipping."
          else
            npm publish --workspace ./packages/cli --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published CLI from a clean directory
        run: npm run smoke:npx

      - name: Create GitHub Release with plugin install notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > /tmp/release-notes.md <<EOF
          ## Graph Engineering Loop ${GITHUB_REF_NAME}

          ### npm

          \`\`\`bash
          npm install -g graph-engineering-loop-workspace
          npx graph-engineering-loop-workspace --version
          loopgraph --version
          \`\`\`

          ### Claude Code plugin (from this repo)

          \`\`\`text
          /plugin marketplace add AnupDangi/Graph-Engineering-Loop
          /plugin install graph-engineering-loop@graph-engineering-loop-marketplace
          \`\`\`

          Local plugin check:

          \`\`\`bash
          npm run build:plugin
          claude --plugin-dir ./claude-plugin
          \`\`\`

          Packages published:

          - graph-engineering-loop-core@${VERSION}
          - graph-engineering-loop-workspace@${VERSION}
          EOF
          # Strip the common leading indent from the heredoc body.
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Graph Engineering Loop ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md
